<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Watermark Remover 3D</title>
    <meta name="description" content="Local in-browser watermark removal studio for images and PDFs with seamless upper-color matching, smart inpainting, and interactive 3D comparison viewer." />
    <meta property="og:title" content="Gemini Watermark Remover 3D" />
    <meta property="og:description" content="Local in-browser watermark removal studio for images and PDFs with seamless upper-color matching, smart inpainting, and interactive 3D comparison viewer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Safeguard against iframe/environment getter-only window.fetch assignment error
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            event.message.indexOf('fetch') !== -1 &&
            event.message.indexOf('getter') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="75%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#093836" />
      <stop offset="40%" stop-color="#081827" />
      <stop offset="80%" stop-color="#040a14" />
      <stop offset="100%" stop-color="#020509" />
    </radialGradient>

    <!-- Corner Ambient Lighting -->
    <radialGradient id="cornerAmbient" cx="90%" cy="85%" r="30%">
      <stop offset="0%" stop-color="#0a2a38" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#061822" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#02080f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="speakerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff885" />
      <stop offset="35%" stop-color="#ffee10" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="shadowHeavy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Circuit Pattern -->
    <pattern id="circuits" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 10 10 L 40 10 L 60 30 L 90 30 M 30 70 L 50 70 L 70 90 L 100 90 M 80 10 L 80 40 L 95 55" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.18" />
      <circle cx="40" cy="10" r="2.5" fill="#0ea5e9" fill-opacity="0.3" />
      <circle cx="70" cy="90" r="2.5" fill="#0ea5e9" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1280" height="720" fill="#030812" />
  <rect width="1280" height="720" fill="url(#bgGlow)" />
  <rect width="1280" height="720" fill="url(#circuits)" />
  <rect width="1280" height="720" fill="url(#cornerAmbient)" />

  <!-- Flare in Bottom Left -->
  <circle cx="30" cy="690" r="140" fill="#38bdf8" opacity="0.35" filter="url(#neonGlow)" />
  <line x1="0" y1="690" x2="300" y2="690" stroke="#7dd3fc" stroke-width="2" opacity="0.6" />

  <!-- Background Floating Coins -->
  <g opacity="0.45" filter="url(#shadowHeavy)">
    <circle cx="480" cy="60" r="45" fill="url(#goldCoin)" />
    <circle cx="960" cy="90" r="35" fill="url(#goldCoin)" />
    <circle cx="380" cy="680" r="55" fill="url(#goldCoin)" />
  </g>

  <!-- Holographic Arrow pointing up-right -->
  <path d="M 640 210 L 670 170 L 700 200 L 750 140" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <polygon points="730,135 765,135 765,170" fill="#22c55e" filter="url(#neonGlow)" />

  <!-- 3D Medical Icons Floating -->
  <!-- Red Heart with Pulse -->
  <g transform="translate(760, 160)" filter="url(#shadowHeavy)">
    <path d="M 40 15 C 25 -5, -5 5, -5 30 C -5 55, 30 75, 40 85 C 50 75, 85 55, 85 30 C 85 5, 55 -5, 40 15 Z" fill="#ef4444" />
    <path d="M 15 35 L 30 35 L 36 20 L 44 48 L 52 28 L 58 35 L 65 35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Medicine Bottle -->
  <g transform="translate(890, 35)" filter="url(#shadowHeavy)">
    <!-- Cap -->
    <rect x="25" y="10" width="40" height="16" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
    <!-- Body -->
    <rect x="15" y="26" width="60" height="85" rx="14" fill="#fb923c" stroke="#c2410c" stroke-width="2" />
    <!-- Label -->
    <rect x="23" y="45" width="44" height="48" rx="4" fill="#ffffff" />
    <!-- Cross -->
    <rect x="40" y="55" width="10" height="28" fill="#0284c7" rx="2" />
    <rect x="31" y="64" width="28" height="10" fill="#0284c7" rx="2" />
  </g>

  <!-- Golden Shield with Lock -->
  <g transform="translate(1005, 120)" filter="url(#shadowHeavy)">
    <path d="M 15 20 Q 50 10 85 20 Q 85 70 50 100 Q 15 70 15 20 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <rect x="40" y="52" width="20" height="20" rx="3" fill="#854d0e" />
    <path d="M 44 52 L 44 44 A 6 6 0 0 1 56 44 L 56 52" fill="none" stroke="#854d0e" stroke-width="3" />
  </g>

  <!-- Smart Speaker & Glowing Energy Rings -->
  <g transform="translate(760, 320)">
    <!-- Speaker Body -->
    <ellipse cx="180" cy="180" rx="120" ry="25" fill="#0f172a" opacity="0.6" />
    
    <!-- Outer green aura -->
    <circle cx="180" cy="130" r="140" fill="url(#speakerGlow)" />

    <!-- Speaker Cylinder -->
    <path d="M 80 80 Q 180 50 280 80 L 280 230 Q 180 260 80 230 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <!-- Speaker top surface -->
    <ellipse cx="180" cy="80" rx="100" ry="30" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Top inner ring and buttons -->
    <ellipse cx="180" cy="80" rx="85" ry="24" fill="#1e293b" stroke="#22c55e" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="140" cy="78" r="4" fill="#94a3b8" />
    <circle cx="220" cy="78" r="4" fill="#94a3b8" />
    <circle cx="180" cy="65" r="4" fill="#94a3b8" />
    <circle cx="180" cy="90" r="4" fill="#94a3b8" />

    <!-- Speaker mesh texture -->
    <path d="M 82 170 Q 180 195 278 170 L 278 228 Q 180 258 82 228 Z" fill="#0b1120" opacity="0.75" />

    <!-- Futuristic Neon Green Spinning Energy Rings around speaker -->
    <ellipse cx="180" cy="115" rx="165" ry="42" fill="none" stroke="#22c55e" stroke-width="5" transform="rotate(-6 180 115)" filter="url(#neonGlow)" />
    <ellipse cx="180" cy="140" rx="155" ry="38" fill="none" stroke="#4ade80" stroke-width="4" transform="rotate(4 180 140)" filter="url(#neonGlow)" />
    <ellipse cx="180" cy="165" rx="145" ry="35" fill="none" stroke="#86efac" stroke-width="3.5" transform="rotate(-3 180 165)" filter="url(#neonGlow)" />
  </g>

  <!-- Robotic Cyber Hand supporting the speaker -->
  <g transform="translate(730, 480)" filter="url(#shadowHeavy)">
    <!-- Palm & Wrist -->
    <path d="M 120 180 L 190 120 L 290 140 L 320 230 L 200 240 Z" fill="#475569" stroke="#94a3b8" stroke-width="3" />
    <!-- Cyber Joints -->
    <circle cx="160" cy="140" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="210" cy="130" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="260" cy="135" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Fingers curled up -->
    <path d="M 160 140 Q 140 80 170 50 Q 185 60 175 100 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="2.5" />
    <path d="M 210 130 Q 200 60 230 40 Q 245 55 230 95 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="2.5" />
    <path d="M 260 135 Q 265 70 295 55 Q 305 70 285 105 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="2.5" />
    <path d="M 300 150 Q 325 110 350 100 Q 355 118 325 140 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="2.5" />
  </g>

  <!-- HUGE 3D TEXT ON LEFT -->
  <!-- "THIS" -->
  <text x="70" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" fill="#000" letter-spacing="-2" filter="url(#shadowHeavy)">THIS</text>
  <text x="70" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" fill="url(#textYellow)" stroke="#27272a" stroke-width="8" letter-spacing="-2">THIS</text>

  <!-- "$4T AI" -->
  <text x="70" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="175" fill="#000" letter-spacing="-4" filter="url(#shadowHeavy)">$4T AI</text>
  <text x="70" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="175" fill="url(#textYellow)" stroke="#27272a" stroke-width="9" letter-spacing="-4">$4T AI</text>

  <!-- "STARTUP" -->
  <text x="70" y="585" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="185" fill="#000" letter-spacing="-4" filter="url(#shadowHeavy)">STARTUP</text>
  <text x="70" y="585" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="185" fill="url(#textYellow)" stroke="#27272a" stroke-width="10" letter-spacing="-4">STARTUP</text>

  <!-- "THE FUTURE OF HEALTH" Banner Subtitle -->
  <text x="70" y="665" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="2" filter="url(#shadowHeavy)">THE FUTURE OF HEALTH</text>

  <!-- Natural Background Circuit lines behind bottom-right corner -->
  <path d="M 1030 630 L 1110 630 L 1150 670 L 1270 670" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-opacity="0.35" />
  <circle cx="1110" cy="630" r="3" fill="#0ea5e9" fill-opacity="0.6" />
  <circle cx="1190" cy="670" r="2.5" fill="#0ea5e9" fill-opacity="0.6" />

  <!-- Ambient Dark Background directly above watermark area (Dark Slate Teal #061922 to #0a2733) -->
  <!-- WATERMARK IN THE BOTTOM-RIGHT CORNER (The target to remove!) -->
  <g id="gemini-watermark-group" transform="translate(1060, 660)">
    <!-- Pill Badge Container -->
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#04272e" fill-opacity="0.92" stroke="#0e5661" stroke-width="1" filter="url(#shadowHeavy)" />
    
    <!-- Gemini Icon (Stylized 2 arches / sparkles) -->
    <g transform="translate(14, 10)">
      <path d="M 4 16 C 4 8, 10 4, 15 4 C 20 4, 26 8, 26 16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 9 16 C 9 11, 12 8, 15 8 C 18 8, 21 11, 21 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Watermark text: "Gemini Notebook" -->
    <text x="46" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#ffffff" letter-spacing="0.5">Gemini Notebook</text>
  </g>
</svg>
